# Manual evidence for consecutive complete integration-target executions.
name: Repeat integration test
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      test-target:
        description: stract integration-test target
        required: true
        type: string
        default: build_revision_contract
      repetitions:
        description: Consecutive executions (1–100)
        required: true
        type: number
        default: 20
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
jobs:
  repeat:
    name: Repeat on Linux (Rust 1.98.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Pin toolchain and initialize scratch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/story606-bootstrap
        run: cargo xtask ci-init
      - name: Native Linux dependencies
        run: cargo xtask native-deps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.10.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-wasm0.15.0-about0.9.2-cdx0.5.9
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
      - name: Install verified tools
        run: |
          cargo xtask node-versions
          cargo xtask install-tools "$STORY584_TOOLS"
      - name: Record environment and repeat complete target
        env:
          TEST_TARGET: ${{ inputs.test-target }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          [[ "$TEST_TARGET" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]] || { echo "Invalid test-target"; exit 2; }
          [[ "$REPETITIONS" =~ ^([1-9]|[1-9][0-9]|100)$ ]] || { echo "Invalid repetitions"; exit 2; }
          git rev-parse HEAD
          git --version
          rustc --version --verbose
          uname -a
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          echo "test-target=$TEST_TARGET repetitions=$REPETITIONS"
          for ((i=1; i<=REPETITIONS; i++)); do
            echo "BEGIN $i/$REPETITIONS"
            if cargo test --locked -p stract --test "$TEST_TARGET"; then
              echo "PASS $i/$REPETITIONS exit=0"
            else
              code=$?
              echo "FAIL $i/$REPETITIONS exit=$code"
              exit "$code"
            fi
          done
