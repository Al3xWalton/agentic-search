# Based on: https://github.com/clap-rs/clap/blob/master/.github/workflows/ci.yml
name: CI
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
jobs:
  linux:
    name: Linux (Rust 1.98.0)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Pin toolchain and initialize scratch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/story584-bootstrap
        run: cargo xtask ci-init
      - name: Native Linux dependencies
        run: cargo xtask native-deps
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.10.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-wasm0.15.0-about0.9.2-cdx0.5.9
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
      - name: Install verified tools
        run: |
          cargo xtask node-versions
          cargo xtask install-tools "$STORY584_TOOLS"
      - name: Verify source and build
        run: ./scripts/ci/all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom.json
          path: ${{ env.STORY584_ARTIFACT_DIR }}/sbom.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-compliance
          path: |
            ${{ env.STORY584_ARTIFACT_DIR }}/members
            ${{ env.STORY584_ARTIFACT_DIR }}/SOURCE_OFFER.md
            ${{ env.STORY584_ARTIFACT_DIR }}/source-offer.json
            ${{ env.STORY584_ARTIFACT_DIR }}/licenses.html
            ${{ env.STORY584_ARTIFACT_DIR }}/gitleaks-*.json
          if-no-files-found: error
  macos:
    name: macOS native (Rust 1.98.0)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Pin toolchain and initialize scratch
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/story584-bootstrap
        run: cargo xtask ci-init
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ runner.os }}-1.98.0-${{ hashFiles('Cargo.lock') }}-wasm0.15.0-about0.9.2-cdx0.5.9
          cache-targets: false
          cache-bin: false
          cache-on-failure: false
      - name: Build native release
        run: cargo build --locked --release
      - name: Verify source offer
        run: ./scripts/ci/source-offer
