[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
hex = "=0.4.3"
sha2 = "=0.10.8"
walkdir = "=2.5.0"
syn = { version = "=2.0.90", features = ["full", "visit"] }
quote = "=1.0.37"
proc-macro2 = { version = "=1.0.92", features = ["span-locations"] }
