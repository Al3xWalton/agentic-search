bangs_path = "data/bangs.json"
gossip_addr = "0.0.0.0:3005"
gossip_seed_nodes = ["0.0.0.0:3006", "0.0.0.0:3007"]
host = "0.0.0.0:3000"
# lambda_model_path = "data/lambdamart.txt"
management_host = "0.0.0.0:3011"
# dual_encoder_model_path = "data/dual_encoder"
prometheus_host = "0.0.0.0:3001"
top_phrases_for_autosuggest = 1_000

[spell_check]
path = "data/web_spell/checker"

[spell_check.correction_config]
correction_threshold = 0.0
lm_prob_weight = 1.0

[thresholds]
entity_sidebar = 0.0
stackoverflow = 0.0

[widgets]
thesaurus_paths = ["data/english-wordnet-2022-subset.ttl"]

# Independent v1 HTTP budgets; management is a distinct loopback HTTP listener.
[v1]
management_http_host = "127.0.0.1:3012"
suppression_store_path = "data/v1/suppression.json"
request_timeout_ms = 60000
max_concurrent_requests = 32

# Private reporting journal and independent serving rules. Local mode is not public-operation approval.
# Omitted store_dir derives a compliance sibling from v1.suppression_store_path.
# No admin_token_file means every compliance management operation is unauthorised.
# A configured listed_hashes_file must be a private, validated hash-only file; updates require restart.
[compliance]
deployment_mode = "local"
intimate_margin_seconds = 172800
retention_months = 36
max_tickets = 10000
max_ticket_events = 256
max_journal_bytes = 268435456
max_payload_bytes = 268435456
max_rules = 100000
max_rules_bytes = 16777216
max_records = 10000
max_record_bytes = 1048576
max_records_bytes = 268435456
statement_version = "619.1"
reading_age = 12
unfounded_policy_version = "619.1"
